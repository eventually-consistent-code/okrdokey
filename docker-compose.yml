#
# The whole deploy story: docker compose up. Data lives in ./data —
# backup = copy one file.

services:
  okrdokey:
    build: .
    ports:
      - '3000:3000'
    volumes:
      - ./data:/data
    restart: unless-stopped
    # AI drafting (optional): set an instance-wide Anthropic key here, or
    # let each team bring its own in Team Settings. AI_FEATURES=off kills
    # every AI route and UI affordance.
    # environment:
    #   ANTHROPIC_API_KEY: sk-ant-...
    #   AI_MODEL: claude-opus-4-8
    #   AI_FEATURES: on
